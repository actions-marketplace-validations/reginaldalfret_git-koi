name: git-koi-aquarium
description: Live animated SVG aquarium & dynamic koi pond drawn from your GitHub activity for your profile README.
branding:
  icon: droplet
  color: blue

inputs:
  login:
    description: Account whose koi to draw.
    default: ${{ github.repository_owner }}
  body:
    description: Body color, one of white, black, asagi, tea, gold, platinum, all, or aquarium.
    default: white
  output-dir:
    description: Folder, relative to the workspace, that receives koi.gif, koi.png, and preview.html.
    default: koi
  token:
    description: Token for reading the account's public data; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22'

    - name: Build git-koi binary
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        go build -o /usr/local/bin/git-koi ./cmd/git-koi

    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_LOGIN: ${{ inputs.login }}
      run: |
        git-koi collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"

    - name: Render the koi
      shell: bash
      env:
        KOI_BODY: ${{ inputs.body }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        if [ "$KOI_BODY" = "aquarium" ]; then
          git-koi aquarium "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$KOI_OUTPUT_DIR"
        elif [ "$KOI_BODY" = "all" ]; then
          for b in asagi black tea gold platinum white; do
            mkdir -p "$KOI_OUTPUT_DIR/$b"
            git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$KOI_OUTPUT_DIR/$b" --body "$b"
          done
          git-koi aquarium "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$KOI_OUTPUT_DIR"
        else
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$KOI_OUTPUT_DIR" --body "$KOI_BODY"
        fi
